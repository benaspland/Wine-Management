name: CI

on:
  push:
    branches: ['**']
  pull_request:

defaults:
  run:
    working-directory: wine-app

jobs:
  checks:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wine-app/package-lock.json
      - run: npm ci
      - run: npx tsc -b --force
      - run: npx eslint src
      - run: npx vitest run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wine-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E against dev server
        run: npx playwright test
      - name: E2E against production build (GitHub Pages base path)
        run: npm run test:e2e:ghpages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: wine-app/test-results/
          retention-days: 7
