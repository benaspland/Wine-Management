name: Deploy to GitHub Pages

# Builds the PWA and publishes it to the gh-pages branch, which GitHub
# Pages serves from. Runs on GitHub's infrastructure (no local machine
# needed) on every push to main and on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two deploys at once.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: wine-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wine-app/package-lock.json
      - run: npm ci
      - run: npm run build:ghpages
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
